<!doctype html>
<html lang="zh-CN"><body style="margin:0;padding:28px;background:#f5faf6;font-family:Arial,'Microsoft YaHei',sans-serif;color:#19331f">
  <main style="max-width:560px;margin:auto;padding:30px;border-radius:20px;background:#fff;box-shadow:0 12px 36px rgba(31,86,43,.09)">
    <p style="margin:0 0 8px;color:#4caf50;font-size:13px;font-weight:700;letter-spacing:.08em">JIANBOX</p>
    <h2 style="margin:0 0 16px;font-size:24px">简盒密码恢复验证码</h2>
    <p>我们收到了一次密码找回请求。请返回简盒并输入以下数字验证码：</p>
    <p style="margin:25px 0;padding:16px;border-radius:12px;background:#edf8ef;color:#237a35;text-align:center;font-size:32px;font-weight:700;letter-spacing:8px">{{ .Token }}</p>
    <p style="color:#6b806f;font-size:13px">验证码只能使用一次，请勿转发给任何人。如果不是你本人发起的请求，请忽略本邮件；你的密码不会改变。</p>
  </main>
</body></html>
