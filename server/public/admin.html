<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简盒后台</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Microsoft YaHei",sans-serif;color:#18351d;background:#eef5ef}.shell{display:grid;grid-template-columns:76px minmax(0,960px);gap:24px;max-width:1100px;margin:32px auto;padding:0 18px}.nav,.panel,.card{background:rgba(255,255,255,.76);border:1px solid rgba(150,195,158,.45);box-shadow:0 10px 35px rgba(25,60,35,.08);backdrop-filter:blur(18px)}.nav{border-radius:18px;padding:12px 8px;height:max-content}.brand,.nav button{width:58px;height:52px;border:0;border-radius:12px;margin-bottom:8px;background:#eef8ef;color:#357140;font-weight:700}.brand{display:grid;place-items:center;background:#4caf50;color:white}.panel{border-radius:20px;padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:24px}.token,input,textarea{width:100%;border:1px solid #c8e6c9;background:rgba(255,255,255,.8);border-radius:10px;padding:11px;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.card{border-radius:14px;padding:16px}.card b{font-size:26px;display:block}.card span{font-size:12px;color:#67806b}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form textarea{grid-column:1/-1;min-height:88px}.actions{display:flex;gap:8px;margin-top:12px}button.action{border:0;border-radius:10px;padding:11px 18px;background:#4caf50;color:white;font-weight:700}button.secondary{background:white;color:#315b38;border:1px solid #c8e6c9}@media(max-width:700px){.shell{grid-template-columns:1fr}.nav{display:none}.stats,.form{grid-template-columns:1fr}.form textarea{grid-column:auto}}</style></head><body><main class="shell"><aside class="nav"><div class="brand">简</div><button>总览</button><button>版本</button><button>用户</button></aside><section class="panel"><div class="top"><div><small>JIANBOX CONTROL</small><h1>简盒服务后台</h1></div><button class="action secondary" onclick="load()">刷新</button></div><input id="token" class="token" type="password" placeholder="管理员令牌"><div class="stats"><div class="card"><b id="registered">--</b><span>注册用户</span></div><div class="card"><b id="day">--</b><span>24 小时活跃</span></div><div class="card"><b id="month">--</b><span>30 天活跃</span></div></div><h3>版本发布</h3><div class="form"><input id="versionName" placeholder="版本名称"><input id="latestVersion" type="number" placeholder="最新 versionCode"><input id="minVersion" type="number" placeholder="最低可用 versionCode"><input id="apkUrl" placeholder="APK 下载地址"><textarea id="notes" placeholder="更新说明"></textarea></div><label><input id="force" type="checkbox" style="width:auto"> 强制更新，低于最低版本时禁止继续使用</label><div class="actions"><button class="action" onclick="save()">发布版本策略</button></div><p id="message"></p></section></main><script>const headers=()=>({'Authorization':'Bearer '+token.value,'Content-Type':'application/json'});async function load(){let r=await fetch('/api/admin/stats',{headers:headers()}),d=await r.json();if(!r.ok){message.textContent=d.error;return}registered.textContent=d.registered;day.textContent=d.active24h;month.textContent=d.active30d;for(let k of ['versionName','latestVersion','minVersion','apkUrl','notes'])document.getElementById(k).value=d.update[k]||'';force.checked=!!d.update.force;message.textContent='数据已更新'}async function save(){let body={versionName:versionName.value,latestVersion:+latestVersion.value,minVersion:+minVersion.value,apkUrl:apkUrl.value,notes:notes.value,force:force.checked};let r=await fetch('/api/admin/update',{method:'POST',headers:headers(),body:JSON.stringify(body)});message.textContent=r.ok?'版本策略已发布':'发布失败'}</script></body></html>
